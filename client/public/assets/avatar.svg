<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="150" cy="150" r="140" fill="url(#glow)" />

  <!-- Avatar Base Circle -->
  <circle cx="150" cy="150" r="120" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Outer Accent Rings -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#neonBorder)" stroke-width="3.5" stroke-dasharray="12 6" opacity="0.85" />
  <circle cx="150" cy="150" r="106" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Tech Dots -->
  <circle cx="150" cy="30" r="4" fill="#38bdf8" />
  <circle cx="270" cy="150" r="4" fill="#818cf8" />
  <circle cx="150" cy="270" r="4" fill="#c084fc" />
  <circle cx="30" cy="150" r="4" fill="#38bdf8" />

  <!-- Initials Monogram -->
  <text x="150" y="172" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#neonBorder)" text-anchor="middle" letter-spacing="-2">SC</text>
  
  <!-- Subtle Tag -->
  <text x="150" y="215" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">DEV / ML / FINTECH</text>
</svg>
